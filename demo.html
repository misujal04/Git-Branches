<!DOCTYPE html>
<html>
<head>
    <title>Student Form</title>
</head>

<body>

    <h1>Student Registration</h1>

    <form>
        <label>Name:</label>
        <input type="text">

        <br><br>

        <label>Email:</label>
        <input type="email">

        <br><br>

        <label>Password:</label>
        <input type="password">

        <br><br>

        <label>Age:</label>
        <input type="number">

        <br><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
